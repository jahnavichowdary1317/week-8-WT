<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd</title>
</head>
<body>
    <script>
        let number = 53;
        if (number%2 == 0){
            console.log("Even Number");
            document.write("Even Numbers");
        } else {
            console.log("Odd Number");
            document.write("Odd Numbers");
        }
    </script>
</body>
</html>
